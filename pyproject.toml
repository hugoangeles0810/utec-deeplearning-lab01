[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anuraset-dl"
version = "0.1.0"
description = "Transferencia de FBRS y DLoGNet a clasificación multietiqueta de anuros"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "py7zr>=1.0,<2",
    "pywavelets>=1.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "soundfile>=0.12",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "pytest>=8.3",
    "ruff>=0.8",
    "seaborn>=0.13",
]
tracking = [
    "mlflow>=3.7,<4",
    "psutil>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anuraset_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
