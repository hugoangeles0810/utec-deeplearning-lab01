experiment: cnn_mel_baseline
seed: 42

data:
  root: dataset
  metadata: dataset/train.csv
  splits:
    train: splits/train.csv
    validation: splits/validation.csv
  sample_rate: 22050
  clip_seconds: 3
  num_labels: 31
  excluded_labels:
    [SCIRIZ, SCIALT, ADEDIP, DENELE, RHISCI, AMEPIC, LEPELE, RHIORN, LEPFLA, SCIFUS, SCINAS]
  zero_label_policy: keep_as_all_negative

features:
  type: mel
  pre_emphasis: 0.97
  window: hamming
  n_fft: 1024
  hop_length: 256
  center: false
  power: 2.0
  n_mels: 128
  f_min: 0
  f_max: 11025
  mel_scale: htk
  filter_normalization: none
  log_epsilon: 1.0e-10
  cache:
    enabled: true
    root: outputs/features
    dtype: float32

model:
  name: cnn
  channels: [32, 64, 128]
  dropout: 0.3

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0001
  loss: bce_with_logits
  device: auto
  num_workers: 0
  checkpoint_dir: outputs/checkpoints
  early_stopping:
    enabled: true
    monitor: validation_loss
    mode: min
    patience: 5
    min_delta: 0.0
    warmup_epochs: 5

evaluation:
  threshold_strategy: per_class_validation_f1
  zero_positive_class_policy: error
  metrics: [precision, recall, f1, map]
  metrics_dir: outputs/metrics

tracking:
  enabled: true
  experiment_name: anuraset_dl
  tracking_uri: sqlite:///outputs/mlflow/mlflow.db
  artifact_root: outputs/mlflow/artifacts
  log_system_metrics: true

preparation:
  metadata_sha256: 38df5d408d9bf621cc11f78ed4cd766be63a8406512c1eb4d611d98e4486d276
  proportions:
    train: 0.8
    validation: 0.2
  split_order: [train, validation]
  minimum_positive_recordings:
    train: 8
    validation: 2
  exploratory_labels: [SCIRIZ, SCIALT, ADEDIP, DENELE]
  exploratory_minimum_positive_recordings:
    train: 1
    validation: 1
  report: splits/report.json
