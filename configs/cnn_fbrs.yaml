experiment: cnn_fbrs
seed: 42

data:
  root: dataset
  metadata: dataset/train.csv
  splits:
    train: splits/train.csv
    validation: splits/validation.csv
  sample_rate: 22050
  clip_seconds: 3
  num_labels: 31
  excluded_labels:
    [SCIRIZ, SCIALT, ADEDIP, DENELE, RHISCI, AMEPIC, LEPELE, RHIORN, LEPFLA, SCIFUS, SCINAS]
  zero_label_policy: keep_as_all_negative

features:
  type: fbrs
  pre_emphasis: 0.97
  window: hamming
  n_fft: 1024
  hop_length: 256
  center: false
  power: 2.0
  log_epsilon: 1.0e-10
  wavelet: db16
  level: 8
  bank_scope: corpus
  fit_subset: active_positive_training
  energy_normalization: per_level
  band_selection: target_count
  target_bands: 128
  filter_shape: triangular
  filter_normalization: peak
  bank_path: outputs/filterbanks/fbrs_db16_l8_b128.pt
  cache:
    enabled: true
    root: outputs/features
    dtype: float32

model:
  name: cnn
  channels: [32, 64, 128]
  dropout: 0.3

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0001
  loss: bce_with_logits
  device: auto
  num_workers: 0
  checkpoint_dir: outputs/checkpoints

evaluation:
  threshold_strategy: per_class_validation_f1
  zero_positive_class_policy: error
  metrics: [precision, recall, f1, map]
  metrics_dir: outputs/metrics

tracking:
  enabled: true
  experiment_name: anuraset_dl
  tracking_uri: sqlite:///outputs/mlflow/mlflow.db
  artifact_root: outputs/mlflow/artifacts
  log_system_metrics: true
